<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>집중 타이머</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  user-select:none;
  -webkit-tap-highlight-color: transparent;
}

html, body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:black;
  font-family:Arial, sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

/* 시작 화면 */
#startScreen{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:25px;
}

h1{
  font-size:40px;
}

input{
  width:220px;
  padding:16px;
  font-size:24px;
  text-align:center;
  border:none;
  border-radius:10px;
  outline:none;
}

button{
  padding:16px 35px;
  font-size:22px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

/* 검은 잠금 화면 */
#lockScreen{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#timer{
  font-size:90px;
  font-weight:bold;
  letter-spacing:3px;
}
</style>
</head>

<body>

<!-- 시작 화면 -->
<div id="startScreen">

  <h1>공부 시간 입력</h1>

  <input
    type="number"
    id="minutesInput"
    placeholder="분 입력"
    min="1"
  >

  <button onclick="startTimer()">
    시작
  </button>

</div>

<!-- 검은 화면 -->
<div id="lockScreen">
  <div id="timer">00:00</div>
</div>

<script>

const startScreen = document.getElementById("startScreen");
const lockScreen = document.getElementById("lockScreen");
const timer = document.getElementById("timer");

let countdown;

// 타이머 시작
function startTimer(){

  const minutes = parseInt(
    document.getElementById("minutesInput").value
  );

  if(!minutes || minutes <= 0){
    alert("시간을 입력하세요.");
    return;
  }

  let totalSeconds = minutes * 60;

  // 화면 전환
  startScreen.style.display = "none";
  lockScreen.style.display = "flex";

  // 전체화면 시도
  enterFullscreen();

  // 초기 시간 표시
  updateTimer(totalSeconds);

  // 카운트다운 시작
  countdown = setInterval(() => {

    totalSeconds--;

    updateTimer(totalSeconds);

    // 종료
    if(totalSeconds <= 0){

      clearInterval(countdown);

      // 알람 울리기
      playAlarm();

      // 3초 후 초기 화면 복귀
      setTimeout(() => {

        lockScreen.style.display = "none";
        startScreen.style.display = "flex";

        document.getElementById("minutesInput").value = "";

        exitFullscreen();

      }, 3000);
    }

  },1000);
}

// 시간 표시
function updateTimer(seconds){

  const min = Math.floor(seconds / 60);
  const sec = seconds % 60;

  timer.textContent =
    String(min).padStart(2,"0")
    + ":"
    + String(sec).padStart(2,"0");
}

// 알람 소리
function playAlarm(){

  const audio = new Audio(
    "https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"
  );

  audio.play();

}

// 전체화면
function enterFullscreen(){

  const elem = document.documentElement;

  if(elem.requestFullscreen){
    elem.requestFullscreen();
  }
}

// 전체화면 종료
function exitFullscreen(){

  if(document.exitFullscreen){
    document.exitFullscreen();
  }
}

// 터치/드래그 방지
document.addEventListener(
  "touchmove",
  function(e){
    e.preventDefault();
  },
  { passive:false }
);

// 우클릭 방지
document.addEventListener(
  "contextmenu",
  function(e){
    e.preventDefault();
  }
);

// 뒤로가기 방지
history.pushState(null, null, location.href);

window.onpopstate = function () {
  history.go(1);
};

</script>

</body>
</html>
