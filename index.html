<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>집중 타이머</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  user-select:none;
}

html, body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:black;
  font-family:Arial, sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

/* 시작 화면 */
#startScreen{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:20px;
}

h1{
  font-size:40px;
}

input{
  width:200px;
  padding:15px;
  font-size:24px;
  text-align:center;
  border:none;
  border-radius:10px;
}

button{
  padding:15px 30px;
  font-size:20px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

/* 검은 화면 */
#lockScreen{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#timer{
  font-size:80px;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="startScreen">
  <h1>공부 시간 입력</h1>

  <input type="number" id="minutesInput" placeholder="분 입력">

  <button onclick="startTimer()">시작</button>
</div>

<div id="lockScreen">
  <div id="timer">00:00</div>
</div>

<script>
const startScreen = document.getElementById("startScreen");
const lockScreen = document.getElementById("lockScreen");
const timer = document.getElementById("timer");

let countdown;

function startTimer(){

  const minutes = parseInt(
    document.getElementById("minutesInput").value
  );

  if(!minutes || minutes <= 0){
    alert("시간 입력");
    return;
  }

  let totalSeconds = minutes * 60;

  startScreen.style.display = "none";
  lockScreen.style.display = "flex";

  updateTimer(totalSeconds);

  countdown = setInterval(() => {

    totalSeconds--;

    updateTimer(totalSeconds);

    if(totalSeconds <= 0){

      clearInterval(countdown);

      lockScreen.style.display = "none";
      startScreen.style.display = "flex";

      document.getElementById("minutesInput").value = "";
    }

  },1000);
}

function updateTimer(seconds){

  const min = Math.floor(seconds / 60);
  const sec = seconds % 60;

  timer.textContent =
    String(min).padStart(2,"0")
    + ":"
    + String(sec).padStart(2,"0");
}
</script>

</body>
</html>
